<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8" />
        <title>Blorb's Website</title>
        <link rel="icon" type="image/x-icon" href="icon.webp">
        <link rel="stylesheet" href="https://unpkg.com/7.css" />
        <link rel="stylesheet" href="style.css" />
        <script type="text/javascript" >
            function change_page(page) {
                if (window.location.hash.substring(1) != "home") window.location.hash = page;
                document.getElementById("iframe").src = page + ".html";
                return false;
            }

            function load_site() {
                if (window.location.hash.substring(1) == "index") {
                    change_page("home");
                    return;
                }
                if (window.location.hash.substring(1) !== "") {
                    change_page(window.location.hash.substring(1));
                } else {
                    change_page("home");
                }
            }
        </script>

        <meta content="confusedcatgirl's Socials!" property="og:title" />
        <meta content="Check out my Socials and more interesting stuff about myself!" property="og:description" />
        <meta content="https://confusedblorb.org/" property="og:url" />
        <meta content="https://confusedblorb.org/icon.webp" property="og:image" />
        <meta content="#0b3975" data-react-helmet="true" name="theme-color" />
    </head>

    <body style="background-image: url(background.jpg); background-size: auto; margin: 0px;" onload="load_site()">
        <div class="window glass active side_bar" id="banner-exe">
            <div class="title-bar">
                <div class="title-bar-text">banner.exe</div>
                <div class="title-bar-controls"><button aria-label="Help" disabled></button><button aria-label="Close" disabled></button></div>
            </div>
            <div class="window-body">
                <img src="blorb.webp" style="margin: 10px; width: calc(100% - 20px);">
                <img src="frog.gif" class="emote" style="position: absolute; bottom: 8px; right: 10px;">
            </div>
        </div>

        <div class="window glass active side_bar" id="navigation-exe">
            <div class="title-bar">
                <div class="title-bar-text">navigation.exe</div>
                <div class="title-bar-controls"><button aria-label="Help" disabled></button><button aria-label="Close" disabled></button></div>
            </div>
            <div class="window-body">
                <ul role="menubar">
                    <li role="menuitem" tabindex="0">File</li>
                    <li role="menuitem" tabindex="0">Edit</li>
                    <li role="menuitem" tabindex="0">View</li>
                    <li role="menuitem" tabindex="0">Help</li>
                </ul>

                <div id="window-nav">
                    <a onclick="return change_page('home');">home</a>
                    <a onclick="return change_page('tos');">tos</a>
                    <a onclick="return change_page('portfolio');">portfolio</a>
                    <a onclick="return change_page('socials');">socials</a>
                    <a onclick="return change_page('wiki');">wiki</a>
                </div>
            </div>
        </div>

        <div class="window glass active" id="window-exe">
            <div class="title-bar">
                <div class="title-bar-text">window.exe</div>
                <div class="title-bar-controls"><button aria-label="Help" disabled></button><button aria-label="Close" disabled></button></div>
            </div>
            <div class="window-body">
                <ul role="menubar">
                    <li role="menuitem" tabindex="0">File</li>
                    <li role="menuitem" tabindex="0">Edit</li>
                    <li role="menuitem" tabindex="0">View</li>
                    <li role="menuitem" tabindex="0">Help</li>
                </ul>
                <iframe id="iframe" src="home.html"></iframe>
            </div>
        </div>

        <div class="window glass active side_bar" id="credits-exe">
            <div class="title-bar">
                <div class="title-bar-text">credits.exe</div>
                <div class="title-bar-controls"><button aria-label="Help" disabled></button><button aria-label="Close" disabled></button></div>
            </div>
            <div class="window-body">
                <img src="icon.webp" style="float:right; width: 96px;">
                <p style="max-width: fit-content;">© 2023 - 2026 confusedcatgirl<br>
                Banner by <a href="https://www.mooshieblob.com/">mooshieblob</a> 2024<br><br>

                Royalty-free Background</p>
                <img src="heart.gif" class="emote" style="position: absolute; bottom: 8px; left: 50%;">
            </div>
        </div>
    </body>
</html>
